services:
  - type: web
    name: sajha-net
    runtime: node
    plan: free
    buildCommand: cd client && npm install --include=dev && npm run build && cd ../admin && npm install --include=dev && npm run build && cd ../server && npm install
    startCommand: cd server && node server.js
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: "7d"
      - key: NODE_ENV
        value: production
      - key: SEED_SECRET
        sync: false
