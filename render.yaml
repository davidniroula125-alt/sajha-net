services:
  - type: web
    name: sajha-net
    runtime: node
    plan: free
    buildCommand: cd server && npm install && cd ../client && npm install && npm run build && cd ../admin && npm install && npm run build
    startCommand: cd server && node server.js
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: "7d"
      - key: NODE_ENV
        value: production
