services:
  - type: web
    name: sajha-net
    runtime: node
    plan: free
    buildCommand: cd client && npm install && npm run build && cd ../admin && npm install && npm run build
    startCommand: cd server && node server.js
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
