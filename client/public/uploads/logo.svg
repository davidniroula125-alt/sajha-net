<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" width="300" height="340">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1545c4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2158e8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Nepali text at top -->
  <text x="150" y="52" font-family="Arial, sans-serif, Noto Sans Devanagari, sans-serif" font-size="48" font-weight="900" fill="#1545c4" text-anchor="middle" letter-spacing="3">साझा नेट</text>
  
  <!-- Blue rounded square background -->
  <rect x="30" y="72" width="240" height="240" rx="32" ry="32" fill="url(#logoBg)"/>
  
  <!-- Interlocking SN monogram in white -->
  <!-- S shape -->
  <path d="M 170 108 C 120 108, 82 138, 82 168 C 82 192, 102 202, 132 214 C 158 224, 180 234, 180 262 C 180 292, 150 306, 118 306" 
        stroke="white" stroke-width="30" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- N shape -->
  <line x1="182" y1="108" x2="182" y2="306" stroke="white" stroke-width="30" stroke-linecap="round"/>
  <line x1="182" y1="108" x2="232" y2="306" stroke="white" stroke-width="30" stroke-linecap="round"/>
  <line x1="232" y1="108" x2="232" y2="306" stroke="white" stroke-width="30" stroke-linecap="round"/>
  
</svg>
